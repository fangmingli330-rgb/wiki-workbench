[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-wiki-workbench"
version = "0.1.1"
description = "Local-first knowledge workbenches with an independent reading module"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
wiki-workbench = "wiki_workbench.server:main"

[tool.setuptools.package-data]
wiki_workbench = ["static/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.packages.find]
include = ["wiki_workbench*"]
